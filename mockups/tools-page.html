<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starling tools page sheet</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* SHEET */

    .sheet {
      padding: 32px 24px 80px;
    }

    .sheet > p {
      max-width: 70ch;
      margin-top: 8px;
      color: var(--mist);
    }

    .sheet h2 {
      margin: 36px 0 4px;
      font-size: 1.3rem;
    }

    .sheet small {
      display: block;
      max-width: 70ch;
      margin-bottom: 12px;
      color: var(--mist);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .sheet a {
      color: var(--frost);
      font-weight: 800;
    }

    .frames {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 28px;
    }

    .wide-frame {
      width: 704px;
      height: 495px;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 0 0 6px var(--high);
    }

    .wide-frame iframe {
      width: 1280px;
      height: 900px;
      border: 0;
      transform: scale(0.55);
      transform-origin: 0 0;
    }

    .phone-frame {
      width: 375px;
      height: 760px;
      border: 0;
      border-radius: 28px;
      background: var(--zenith);
      box-shadow: 0 0 0 6px var(--high);
    }



    /* PAGE */

    .tools-page {
      padding: calc(var(--header-height, 92px) + 28px) var(--gutter) 100px;
    }

    .tools-page h1 {
      color: var(--moon);
      font-size: clamp(2.2rem, 4.4vw, 3.2rem);
      font-variation-settings: 'SOFT' 100;
    }

    .tools-page .inner > p {
      margin: 8px 0 28px;
      color: var(--mist);
      font-size: 1.15rem;
    }



    /* GRID */

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 20px;
      padding: 0;
      list-style: none;
    }

    .tool {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--high);
    }

    .tool-art {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      background: var(--raised);
    }

    @media (max-width: 600px) {
      .tool-art {
        aspect-ratio: 2 / 1;
      }
    }

    .tool-art svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .tool-art span {
      color: var(--mist);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .tool-text {
      padding: 18px 24px 24px;
    }

    .tool h2 {
      margin: 0;
      font-size: 1.35rem;
      font-variation-settings: 'SOFT' 100;
    }

    .tool p {
      margin-top: 6px;
      color: var(--mist);
      font-weight: 700;
    }

    .tool a {
      color: inherit;
      text-decoration: none;
    }

    .tool a::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
    }

    .tool:has(a):hover {
      background: color-mix(in srgb, var(--high) 85%, var(--raised));
    }

    .tool:has(a:focus-visible) {
      outline: 3px solid var(--beak);
      outline-offset: 3px;
    }

    .tool a:focus-visible {
      outline: none;
    }

    @media (prefers-reduced-motion: no-preference) {
      :root:not(.still) .tool:has(a) {
        transition: scale 0.35s cubic-bezier(0.3, 1.3, 0.6, 1), background-color 90ms ease-out;
      }

      :root:not(.still) .tool:has(a):active {
        scale: 0.985;
        transition-duration: 0.1s, 90ms;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./tools-page.jsx"></script>
</body>
</html>
