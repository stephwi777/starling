<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starling big calendar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* PAGE */

    .sheet {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      font-variant-numeric: tabular-nums;
    }

    .sheet > p {
      max-width: 72ch;
      margin-top: 8px;
      color: var(--mist);
    }

    .sheet > h2 {
      margin-top: 48px;
      font-size: 1.4rem;
    }

    .frame {
      margin-top: 18px;
      padding: 28px 24px 36px;
      border-radius: 30px;
      background: var(--zenith);
      outline: 2px solid var(--raised);
    }

    .phone {
      width: 375px;
      padding: 22px 12px 28px;
    }



    /* CATEGORY COLORS */

    .moon-c { --c: var(--moon); }
    .meteor-c { --c: var(--teal); }
    .planet-c { --c: var(--bronze); }
    .sun-c { --c: var(--beak); }
    .eclipse-c { --c: var(--star-rose); }
    .comet-c { --c: var(--snow); }
    .aurora-c { --c: var(--star-teal); }



    /* HEAD */

    .cal-top {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 14px 24px;
    }

    .cal-top h1 {
      color: var(--moon);
      font-size: clamp(1.9rem, 4vw, 2.6rem);
    }

    .cal-top p {
      color: var(--mist);
      font-weight: 700;
    }

    .switch {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      padding: 4px;
      border-radius: 999px;
      background: var(--high);
      font-size: 0.9rem;
      font-weight: 800;
    }

    .switch::before {
      content: '';
      position: absolute;
      inset: 4px auto 4px 4px;
      width: calc(50% - 4px);
      border-radius: 999px;
      background: var(--raised);
      transition: translate 0.3s cubic-bezier(0.3, 1.3, 0.6, 1);
    }

    .switch.world::before {
      translate: 100% 0;
    }

    .switch button {
      position: relative;
      min-height: 40px;
      padding: 0 16px;
      border: 0;
      background: none;
      color: var(--mist);
      font: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .switch button[aria-pressed="true"] {
      color: var(--frost);
    }



    .search {
      min-height: 44px;
      width: 220px;
      padding: 0 16px;
      border: 0;
      border-radius: 16px;
      background: var(--high);
      color: var(--frost);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .search::placeholder {
      color: var(--mist);
    }

    .phone .search {
      width: 100%;
    }



    /* LAYOUT */

    .cal-body {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 20px;
      margin-top: 22px;
    }



    /* SIDEBAR */

    .side {
      align-self: start;
      padding: 20px 18px;
      border-radius: 26px;
      background: var(--high);
    }

    .side h2 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 900;
    }

    .side > p {
      margin-top: 2px;
      color: var(--mist);
      font-size: 0.82rem;
    }

    .group {
      margin-top: 14px;
    }

    .group summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 36px;
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }

    .group summary::-webkit-details-marker {
      display: none;
    }

    .group summary small {
      margin-left: auto;
      color: var(--mist);
      font-size: 0.78rem;
    }

    .group summary::after {
      content: '›';
      color: var(--mist);
      font-size: 1.3rem;
      line-height: 1;
      transition: rotate 0.2s;
    }

    .group[open] summary::after {
      rotate: 90deg;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 5px;
      background: var(--c);
    }

    .group label {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding-left: 4px;
      color: var(--frost);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .group input {
      width: 18px;
      height: 18px;
      accent-color: var(--c);
    }



    /* MONTH */

    .month {
      padding: 18px 18px 20px;
      border-radius: 26px;
      background: var(--high);
    }

    .month-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .month-top h2 {
      font-size: 1.5rem;
    }

    .month-top .nav {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .month-top button {
      min-width: 40px;
      height: 40px;
      padding: 0 14px;
      border: 0;
      border-radius: 12px;
      background: var(--raised);
      color: var(--frost);
      font: inherit;
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border-radius: 18px;
      overflow: hidden;
      gap: 2px;
      background: var(--raised);
    }

    .weekday {
      padding: 8px 0;
      background: var(--high);
      color: var(--mist);
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
    }

    .cell {
      display: grid;
      align-content: start;
      gap: 4px;
      min-height: 112px;
      padding: 6px 5px;
      background: var(--high);
    }

    .cell.blank {
      background: color-mix(in srgb, var(--high) 60%, var(--zenith));
    }

    .cell > b {
      justify-self: center;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .cell.today > b {
      background: var(--teal);
      color: var(--zenith);
    }

    .chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      padding: 3px 6px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--c) 22%, var(--high));
      font-size: 0.74rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .chip.open {
      outline: 2px solid var(--c);
    }

    .chip svg {
      flex: none;
      width: 14px;
      height: 14px;
    }

    .chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip.world {
      background: none;
      outline: 1.5px dashed color-mix(in srgb, var(--c) 60%, transparent);
      outline-offset: -1.5px;
      color: var(--mist);
    }



    /* DETAIL POPOVER */

    .detail {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 5;
      width: 330px;
      padding: 18px 18px 16px;
      border-radius: 22px;
      background: var(--raised);
      box-shadow: 0 18px 36px color-mix(in srgb, var(--zenith) 80%, transparent);
      font-size: 0.9rem;
      font-weight: 700;
      white-space: normal;
    }

    .detail header {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .detail header svg {
      width: 30px;
      height: 30px;
    }

    .detail h3 {
      font-size: 1.15rem;
    }

    .detail .tag {
      color: var(--c);
      font-size: 0.78rem;
      font-weight: 900;
    }

    .detail p {
      margin-top: 10px;
      color: var(--frost);
      font-weight: 700;
    }

    .detail dl {
      margin-top: 10px;
    }

    .detail dl div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
    }

    .detail dl div + div {
      border-top: 2px solid var(--high);
    }

    .detail dd {
      color: var(--mist);
      text-align: right;
    }



    /* LIST BELOW */

    .all {
      margin-top: 20px;
      padding: 6px 18px;
      border-radius: 26px;
      background: var(--high);
    }

    .all > summary {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-variation-settings: 'SOFT' 100;
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }

    .all > summary::-webkit-details-marker {
      display: none;
    }

    .all > summary::after {
      content: '›';
      margin-left: auto;
      color: var(--mist);
      font-family: var(--font-body);
      font-size: 1.6rem;
      transition: rotate 0.2s;
    }

    .all[open] > summary::after {
      rotate: 90deg;
    }

    .month-label {
      margin: 16px 0 2px;
      color: var(--mist);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 800;
    }

    .events {
      padding-bottom: 8px;
    }

    .events li {
      display: grid;
      grid-template-columns: 48px 44px 1fr;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
    }

    .events li + li {
      border-top: 2px solid var(--raised);
    }

    .when {
      display: grid;
      justify-items: center;
      line-height: 1.1;
    }

    .when small {
      color: var(--mist);
      font-size: 0.72rem;
      font-weight: 800;
    }

    .when b {
      font-size: 1.3rem;
      font-weight: 900;
    }

    .events .row-text small {
      display: block;
      color: var(--mist);
      font-size: 0.88rem;
    }



    /* PHONE */

    .phone .cal-body {
      grid-template-columns: 1fr;
    }

    .phone .side {
      display: none;
    }

    .phone .cell {
      min-height: 64px;
      padding: 4px 2px;
      gap: 3px;
    }

    .phone .chip {
      height: 6px;
      padding: 0;
      border-radius: 3px;
      background: var(--c);
    }

    .phone .chip svg,
    .phone .chip span {
      display: none;
    }

    .phone .chip.world {
      background: none;
    }

    .phone .month {
      padding: 14px 10px 16px;
    }

    .phone .filter {
      display: flex;
    }

    .filter {
      display: none;
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 16px;
      background: var(--high);
      color: var(--frost);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      align-items: center;
    }

    .day-list {
      display: none;
      margin-top: 14px;
    }

    .phone .day-list {
      display: block;
    }

    .day-list h3 {
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./calendar-big.jsx"></script>
</body>
</html>
