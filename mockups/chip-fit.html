<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starling chip fit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* PAGE */

    .sheet {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 24px 100px;
    }

    .sheet > p,
    .sheet section > p {
      max-width: 70ch;
      margin-top: 8px;
      color: var(--mist);
    }

    .sheet section {
      margin-top: 56px;
    }

    .sheet h2 {
      font-size: 1.5rem;
    }

    figure {
      margin-top: 20px;
    }

    figcaption {
      margin-bottom: 8px;
      color: var(--mist);
      font-size: 0.85rem;
      font-weight: 800;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }



    /* B · THREE LINES */

    .vB .chip span {
      -webkit-line-clamp: 3;
    }



    /* C · SMALLER TEXT */

    .vC .chip {
      gap: 4px;
      padding: 4px 5px;
      font-size: 0.68rem;
      letter-spacing: -0.01em;
    }

    .vC .chip svg {
      width: 13px;
      height: 13px;
    }



    /* D · NO ICON */

    .vD .chip svg {
      display: none;
    }



    /* E · ICON ABOVE */

    .vE .chip {
      flex-direction: column;
      gap: 2px;
    }

    .vE .chip svg {
      width: 13px;
      height: 13px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./chip-fit.jsx"></script>
</body>
</html>
