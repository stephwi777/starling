<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starling red light options</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* SHEET */

    .sheet {
      max-width: 1240px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    .sheet > p,
    .sheet section > p {
      max-width: 70ch;
      margin-top: 8px;
      color: var(--mist);
    }

    .sheet a {
      color: var(--frost);
    }

    .sheet section {
      margin-top: 48px;
    }

    .sheet h2 {
      font-size: 1.5rem;
    }

    .frames {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 20px;
      margin-top: 16px;
    }

    .frames iframe {
      border: 0;
      border-radius: 26px;
      background: var(--zenith);
    }

    .frames .wide {
      flex: 1 1 520px;
      overflow: hidden;
      border-radius: 26px;
    }

    .frames .wide iframe {
      border-radius: 0;
      transform-origin: 0 0;
    }

    .frames .phone {
      flex: none;
      width: 375px;
      height: 620px;
    }



    /* PREVIEW */

    html:has(.in-frame) {
      scrollbar-width: none;
    }

    .in-frame .header {
      position: relative;
    }

    .sample {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px var(--gutter) 40px;
      box-sizing: content-box;
    }

    .sample h1 {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--frost);
    }

    .sample > p {
      margin-top: 4px;
      color: var(--mist);
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .tile {
      display: grid;
      gap: 2px;
      padding: 18px 20px;
      border-radius: var(--radius-tile, 26px);
      background: var(--high);
    }

    .tile strong {
      color: var(--frost);
      font-size: 1.4rem;
      font-weight: 900;
    }

    .tile strong.teal {
      color: var(--teal);
    }

    .tile small {
      color: var(--mist);
      font-weight: 700;
    }

    .moon-drawing {
      width: 40px;
      height: 40px;
      margin-bottom: 8px;
      border-radius: 50%;
      background: var(--moon);
    }

    .in-frame .footer-body {
      padding-top: 24px;
    }

    .footer-switches {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0 24px;
    }



    /* CLOSE-UP */

    .close-up {
      display: flex;
      justify-content: center;
      margin-top: 16px;
      padding: 28px;
      border-radius: 26px;
      background: var(--ink);
    }

    .close-up .fun-switch {
      zoom: 2;
    }



    /* SWITCH */

    .fun-switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--snow);
      font-size: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .fun-switch:focus-visible {
      outline: none;
    }

    .fun-switch:focus-visible .track {
      outline: 3px solid var(--beak);
      outline-offset: 2px;
    }

    .track {
      position: relative;
      flex: none;
      width: 60px;
      height: 34px;
      border-radius: 999px;
      background: var(--far-hills);
      overflow: hidden;
      transition: background 0.3s;
    }

    .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
    }

    .knob svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    [aria-checked="true"] .knob {
      transform: translateX(26px);
    }



    /* MOON */

    .moon-face {
      fill: var(--moon);
    }

    .crater {
      fill: var(--moon-shadow);
      opacity: 0.4;
    }

    .moon[aria-checked="true"] .track {
      background: var(--moon-dark);
    }

    .moon[aria-checked="true"] .knob {
      transform: translateX(26px) rotate(200deg);
    }

    .stars i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--frost);
      animation: twinkle 0.6s ease-out both;
    }

    .stars i:nth-child(2) {
      animation-delay: 0.08s;
    }

    .stars i:nth-child(3) {
      animation-delay: 0.16s;
    }

    .stars i:nth-child(4) {
      animation-delay: 0.24s;
    }

    @keyframes twinkle {
      0% {
        transform: scale(0);
      }
      55% {
        transform: scale(2);
      }
    }



    /* FLASHLIGHT */

    .torch-body {
      fill: var(--mist);
    }

    .torch-lens {
      fill: var(--ink);
    }

    .torch-bulb {
      fill: var(--moon-shadow);
      transition: fill 0.2s 0.2s;
    }

    .beam {
      position: absolute;
      inset: 6px 24px 6px 5px;
      background: var(--beak);
      opacity: 0;
      clip-path: polygon(0 0, 100% 38%, 100% 62%, 0 100%);
      transition: opacity 0.3s;
    }

    .flashlight[aria-checked="true"] .torch-bulb {
      fill: var(--beak);
    }

    .flashlight[aria-checked="true"] .knob {
      box-shadow: 0 0 12px 2px color-mix(in srgb, var(--beak) 70%, transparent);
    }

    .flashlight[aria-checked="true"] .beam {
      opacity: 0.4;
      transition-delay: 0.3s;
    }



    /* EYE */

    .eye-ball {
      fill: var(--moon);
    }

    .eye-white {
      fill: var(--frost);
      stroke: var(--ink);
      stroke-width: 1.6;
    }

    .eye-pupil {
      fill: var(--ink);
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.4s 0.3s;
    }

    .eye-lid {
      fill: var(--moon);
      transform-box: fill-box;
      transform-origin: top;
      transform: scaleY(0);
      animation: blink 0.45s ease-in-out;
    }

    .eye[aria-checked="true"] .eye-pupil {
      transform: scale(1.9);
    }

    @keyframes blink {
      50% {
        transform: scaleY(1);
      }
    }



    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      .track,
      .knob,
      .torch-bulb,
      .beam,
      .eye-pupil {
        transition: none !important;
      }

      .stars i,
      .eye-lid {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./red-light.jsx"></script>
</body>
</html>
